name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-demo:ci .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-demo:ci .

      - name: Lancer le conteneur
        run: docker run -d -p 5000:5000 --name test-container flask-demo:ci

      - name: Attendre le démarrage
        run: sleep 5

      - name: Tester la route /health
        run: curl -f http://localhost:5000/health

      - name: Nettoyer
        run: docker stop test-container && docker rm test-container

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simuler le déploiement
        run: echo "Déploiement simulé - à configurer avec un vrai serveur plus tard"
