name: CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-demo:ci .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-demo:ci .

      - name: Lancer le conteneur
        run: docker run -d -p 5000:5000 --name test-container flask-demo:ci

      - name: Attendre le démarrage
        run: sleep 5

      - name: Vérifier l'état du conteneur
        run: docker ps -a

      - name: Voir les logs du conteneur
        run: docker logs test-container

      - name: Tester la route /health
        run: curl -f http://localhost:5000/health

      - name: Nettoyer
        run: docker stop test-container && docker rm test-container

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: recuperer
        uses: actions/checkout@v4
      - name: arreter cont precedents
        run:  docker stop flask-app || true && docker rm flask-app || true  
      - name: Construire et lancer le conteneur
        run: docker build -t flask-demo:latest . && docker run -d -p 5000:5000 --name flask-app --network flask-docker-demo_default flask-demo:latest
