name: CI

on: [push]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-demo:ci .

      - name: expoorter limage en fichier  
        run: docker save flask-demo:ci -o  flask-demo.tar

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: flask-image
          path: flask-demo.tar

      - name: connexio
        uses: docker/login-action@v3
        with:
          name: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
     
      - name: tagons
        run: docker tag flask-demo:ci berlin04/flask-demo:latest
      
      - name: poussons
        run: docker push berlin04/flask-demo:latest


  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          name: flask-image
 
      - name: charger limage docker 
        run: docker load -i flask-demo.tar

      - name: Nettoyer un éventuel conteneur résiduel
        run: docker rm -f test-container || true

      - name: Lancer le conteneur
        run: docker run -d -p 5001:5000 --name test-container flask-demo:ci

      - name: Attendre le démarrage
        run: sleep 5

      - name: Vérifier l'état du conteneur
        run: docker ps -a

      - name: Voir les logs du conteneur
        run: docker logs test-container

      - name: Tester la route /health
        run: curl -f http://localhost:5001/health

      - name: Nettoyer
        run: docker stop test-container && docker rm test-container

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: recuperer
        uses: actions/checkout@v4
      - name: arreter cont precedents
        run:  docker stop flask-app || true && docker rm flask-app || true  
      - name: Construire et lancer le conteneur
        run: docker build -t flask-demo:latest . && docker run -d -p 5000:5000 --name flask-app flask-demo:latest
